<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Bunny AI</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bunny">
<style>
  :root { color-scheme: light dark; --bg: #faf9f6; --surface: #fff; --text: #1f2023; --dim: #62666f; --line: #e6e2da; --accent: #6a4fd8; --ink: #1f2023; --on-ink: #fff; --bad: #cf3f55; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141518; --surface: #1f2025; --text: #ececee; --dim: #a0a2aa; --line: #2c2d33; --accent: #b3a1ff; --ink: #ececee; --on-ink: #141518; --bad: #f07a8c; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; padding: 16px; }
  main { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--dim); font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  button { margin-top: 14px; width: 100%; font: inherit; font-weight: 600; padding: 10px 12px; border: 0; border-radius: 10px; background: var(--ink); color: var(--on-ink); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { margin-top: 12px; min-height: 1.5em; font-size: 14px; color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Bunny AI</h1>
  <p>This computer is sharing Bunny with devices on your network. Enter the passcode that was set on the computer.</p>
  <form id="form" autocomplete="off">
    <label for="passcode">Passcode</label>
    <input id="passcode" name="passcode" type="password" autocomplete="current-password" autofocus required>
    <button id="go" type="submit">Sign in</button>
    <div id="msg" role="alert"></div>
  </form>
</main>
<script src="/src/ui/signin.js"></script>
</body>
</html>
