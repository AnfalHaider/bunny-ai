<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Customize — Bunny AI</title>
<link rel="stylesheet" href="./app.css" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
</head>
<body>
<!-- Connectors (MCP servers), skills and plugins in one place.
     Connectors and skills use the same stores as Automation; a plugin is a bundle
     of connectors and skills, recorded in settings.plugins so it can be removed as one. -->
<main class="page cz-page">
  <h1>Customize</h1>
  <p class="sub">Connectors, skills and plugins the model can use in your chats</p>

  <div class="cz-bar">
    <div class="cz-tabs" role="tablist" aria-label="What to show">
      <button role="tab" class="cz-tab is-active" data-kind="connectors" aria-selected="true">Connectors</button>
      <button role="tab" class="cz-tab" data-kind="skills" aria-selected="false">Skills</button>
      <button role="tab" class="cz-tab" data-kind="plugins" aria-selected="false">Plugins</button>
    </div>
    <div class="mode-switch cz-scope" role="group" aria-label="Yours or discover">
      <button class="is-active" data-scope="yours" aria-pressed="true">Yours</button>
      <button data-scope="discover" aria-pressed="false">Discover</button>
    </div>
    <input class="input sm cz-search" id="cz-search" type="search" placeholder="Search" aria-label="Search" />
    <div class="cz-add-wrap">
      <button class="btn btn-primary btn-sm" id="cz-add" aria-haspopup="menu" aria-expanded="false">＋ Add</button>
      <div class="menu down cz-add-menu" id="cz-add-menu" role="menu" hidden>
        <button class="menu-item" role="menuitem" data-add="connector"><span class="label">Connector<small>An MCP server reached over https</small></span></button>
        <button class="menu-item" role="menuitem" data-add="skill"><span class="label">Skill<small>Instructions the model follows when it is on</small></span></button>
        <button class="menu-item" role="menuitem" data-add="github"><span class="label">Plugin from GitHub<small>Paste a repository link: its skills and connectors are added</small></span></button>
        <button class="menu-item" role="menuitem" data-add="plugin"><span class="label">Plugin from file<small>A .json bundle of connectors and skills</small></span></button>
      </div>
      <input type="file" id="cz-plugin-file" accept=".json,application/json" hidden />
    </div>
  </div>

  <!-- add forms -->
  <form class="card card-form cz-form" id="cz-connector-form" hidden>
    <div class="form-row">
      <input class="input" name="title" placeholder="Name" aria-label="Connector name" required />
      <input class="input" name="url" type="url" placeholder="https://example.com/mcp" aria-label="Connector address" required />
    </div>
    <div class="actions"><button type="submit" class="btn btn-primary btn-sm">Add connector</button><button type="button" class="btn btn-ghost btn-sm" data-cancel>Cancel</button><span class="err" data-err></span></div>
  </form>
  <form class="card card-form cz-form" id="cz-github-form" hidden>
    <div class="form-row">
      <input class="input" name="url" placeholder="https://github.com/owner/repo" aria-label="GitHub repository link" required />
      <button type="submit" class="btn btn-primary btn-sm">Install</button>
      <button type="button" class="btn btn-ghost btn-sm" data-cancel>Cancel</button>
    </div>
    <span class="field-help">Skills (SKILL.md, with their reference files) and remote connectors (.mcp.json) are added. Hooks and scripts made for other apps are skipped.</span>
    <span class="err" data-err></span>
  </form>
  <form class="card card-form cz-form" id="cz-skill-form" hidden>
    <input class="input" name="title" placeholder="Name" aria-label="Skill name" required />
    <input class="input" name="description" placeholder="What is it for?" aria-label="Skill description" />
    <textarea class="textarea" name="instructions" rows="4" placeholder="The instructions the model should follow" aria-label="Skill instructions" required></textarea>
    <div class="actions"><button type="submit" class="btn btn-primary btn-sm">Add skill</button><button type="button" class="btn btn-ghost btn-sm" data-cancel>Cancel</button><span class="err" data-err></span></div>
  </form>

  <div class="cz-bulk" id="cz-bulk" hidden>
    <span id="cz-bulk-count">0 selected</span>
    <button class="btn btn-sm" data-bulk="on">Turn on</button>
    <button class="btn btn-sm" data-bulk="off">Turn off</button>
    <button class="btn btn-sm btn-danger" data-bulk="remove">Remove</button>
    <span class="spacer"></span>
    <span class="hint" id="cz-bulk-note"></span>
    <button class="btn btn-ghost btn-sm" data-bulk="clear">Clear</button>
  </div>
  <div class="cz-table" role="table" aria-label="Items">
    <div class="cz-row cz-head" role="row">
      <span role="columnheader" class="cz-name"><input type="checkbox" id="cz-all" aria-label="Select all shown" /><span id="cz-col-name">Connector</span></span><span role="columnheader">Type</span><span role="columnheader">Status</span><span></span>
    </div>
    <div id="cz-list" role="rowgroup"></div>
  </div>
  <p class="hint cz-note" id="cz-note"></p>
  <p class="hint text-bad" id="cz-error" role="alert" hidden></p>

  <p class="note page-links"><a href="./index.html">← Back to chat</a></p>
</main>

<script type="module">
  import { getJSON, sendJSON, applyTheme, applyAppearance } from './api.js';
  import { applyEmbed } from './embed.js';
  import { connectorStatus, renderStatus, createSignInFlows } from './connectorStatus.js';
  applyEmbed();

  const $ = (id) => document.getElementById(id);
  const view = { kind: 'connectors', scope: 'yours', q: '' };
  const picked = new Set();   // ids selected for a bulk action (this tab only)
  let shownIds = [];
  let data = { connectors: [], skills: [], plugins: [] };

  // ---- Discover: only things that work with no sign-in (checked 2026-11-15) ----
  const CATALOG = {
    connectors: [
      { name: 'DeepWiki', url: 'https://mcp.deepwiki.com/mcp', desc: 'Ask questions about any public GitHub repository' },
      { name: 'Context7', url: 'https://mcp.context7.com/mcp', desc: 'Up-to-date docs and code examples for libraries' },
    ],
    skills: [
      { name: 'Code reviewer', description: 'Reviews a change for bugs before style',
        instructions: 'When asked to review code, look for correctness bugs first, then security issues, then readability. Quote the exact line, say what goes wrong with a concrete input, and suggest the smallest fix. Skip style nits unless asked.' },
      { name: 'Commit message writer', description: 'Short, clear commit messages',
        instructions: 'When asked for a commit message, write a subject line under 60 characters in the imperative mood, a blank line, then two or three lines on why the change was made. No emoji, no trailers.' },
      { name: 'Plain-language explainer', description: 'Explains without jargon',
        instructions: 'Explain things in plain words a smart non-specialist understands. Lead with the answer, use one concrete example, define any term you cannot avoid, and keep it short.' },
      { name: 'Test writer', description: 'Writes focused tests for a function',
        instructions: 'When asked for tests, cover the normal case, the edge cases and one failure case. Name each test after the promise it checks. Use the project test framework if one is visible.' },
    ],
    plugins: [
      { name: 'Developer docs pack', description: 'DeepWiki and Context7 connectors plus a skill that cites its sources',
        connectors: [
          { name: 'DeepWiki', url: 'https://mcp.deepwiki.com/mcp' },
          { name: 'Context7', url: 'https://mcp.context7.com/mcp' },
        ],
        skills: [{ name: 'Cite sources', description: 'Says where an answer came from',
          instructions: 'When you use a connector to answer, name the source (repository, library and page) next to the claim it supports.' }] },
    ],
  };

  async function load() {
    const [connectors, skills, settings] = await Promise.all([
      getJSON('/api/mcp'), getJSON('/api/skills'), getJSON('/api/settings'),
    ]);
    applyAppearance(settings);
    // W3-6: who is signed in to each remote connector (never a token; a local connector has no sign-in and answers 404)
    await Promise.all(connectors.map(async (c) => { c.oauth = c.type === 'local' ? null : await getJSON(`/api/connectors/${c.id}/oauth`).catch(() => null); }));
    data = { connectors, skills, plugins: settings.plugins ?? [] };
    paint();
  }

  // ---- signing in to a connector (W3-6; the states and the flow are in connectorStatus.js, shared with Automation) ----
  let notice = '';
  const flows = createSignInFlows({
    getJSON, sendJSON, onChange: () => paint(),
    onSignedIn: async (s, now) => { notice = `Signed in to ${s.name} as ${now.account ?? 'your account'}.`; await load(); },
  });
  async function startSignIn(s) { notice = ''; await flows.start(s); }
  async function signOut(s) { notice = await flows.signOut(s); await load(); }

  const pluginOf = (kind, id) => data.plugins.find((p) => (p[kind] ?? []).includes(id));
  const initial = (name) => (String(name).match(/\p{L}|\p{N}/u)?.[0] ?? '?').toUpperCase();
  const matches = (...fields) => !view.q || fields.join(' ').toLowerCase().includes(view.q);

  function el(tag, props = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'className') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    n.append(...kids.filter(Boolean));
    return n;
  }

  function row({ id, name, sub, type, typeTag, status, statusClass, statusNode = null, actions = [], extra = null }) {
    let box = null;
    if (id && view.scope === 'yours') {
      shownIds.push(id);
      box = el('input', { type: 'checkbox', 'aria-label': `Select ${name}` });
      box.checked = picked.has(id);
      box.addEventListener('change', () => { if (box.checked) picked.add(id); else picked.delete(id); paintBulk(); });
    }
    return el('div', { className: `cz-row${id && picked.has(id) ? ' is-picked' : ''}`, role: 'row' },
      el('span', { className: 'cz-name', role: 'cell' },
        box,
        el('span', { className: 'cz-logo', 'aria-hidden': 'true', text: initial(name) }),
        el('span', { className: 'cz-text' }, el('b', { text: name }), sub ? el('small', { text: sub }) : null, extra)),
      el('span', { className: 'cz-type', role: 'cell' }, document.createTextNode(type), typeTag ? el('span', { className: 'badge', text: typeTag }) : null),
      statusNode ?? el('span', { className: `cz-status ${statusClass ?? ''}`, role: 'cell', text: status }),
      el('span', { className: 'cz-actions', role: 'cell' }, ...actions));
  }

  function toggle(on, label, change) {
    return el('button', { className: 'toggle', role: 'switch', 'aria-checked': String(on), 'aria-label': label,
      onclick: async (e) => { e.currentTarget.disabled = true; await change(!on); await load(); } });
  }
  const act = (text, onclick, cls = 'btn btn-ghost btn-sm') => el('button', { className: cls, text, onclick });

  function paintYours() {
    const list = $('cz-list');
    if (view.kind === 'connectors') {
      for (const s of data.connectors.filter((s) => matches(s.name, s.url))) {
        const plugin = pluginOf('connectors', s.id);
        const flow = flows.get(s.id);
        const signedIn = s.oauth?.signedIn === true;
        const st = connectorStatus(s, flow);
        const statusNode = renderStatus(st, document);
        statusNode.setAttribute('role', 'cell');
        list.append(row({
          id: s.id,
          name: s.name, sub: plugin ? `Provided by the ${plugin.name} plugin` : s.url,
          type: 'Remote', typeTag: plugin ? 'Plugin' : 'Custom',
          statusNode,
          extra: flows.clientIdBox(s),
          actions: [
            st.wait ? act('Cancel', () => { flows.clear(s.id); paint(); }) : null,
            st.canSignIn ? act(st.signInLabel, () => startSignIn(s)) : null,
            signedIn ? act('Sign out', () => signOut(s)) : null,
            act('Test', async (e) => { e.currentTarget.textContent = 'Testing…'; notice = ''; await fetch(`/api/mcp/${s.id}/tools`); flows.clear(s.id); await load(); }),
            act(s.trustReadOnly ? 'Read-only labels trusted' : 'Trust read-only labels', async () => { await sendJSON(`/api/mcp/${s.id}`, 'PATCH', { trustReadOnly: !s.trustReadOnly }); await load(); }),
            toggle(s.enabled, `Use ${s.name}`, (on) => sendJSON(`/api/mcp/${s.id}`, 'PATCH', { enabled: on })),
            plugin ? null : act('Remove', async () => { await sendJSON(`/api/mcp/${s.id}`, 'DELETE'); await load(); }, 'btn btn-danger btn-sm'),
          ],
        }));
      }
    } else if (view.kind === 'skills') {
      for (const s of data.skills.filter((s) => matches(s.name, s.description))) {
        const plugin = pluginOf('skills', s.id);
        list.append(row({
          id: s.id,
          name: s.name, sub: plugin ? `Provided by the ${plugin.name} plugin` : s.description,
          type: 'Skill', typeTag: plugin ? 'Plugin' : 'Custom',
          status: s.enabled ? 'On' : 'Off', statusClass: s.enabled ? 'text-ok' : '',
          actions: [
            toggle(s.enabled, `Use ${s.name}`, (on) => sendJSON(`/api/skills/${s.id}`, 'PATCH', { enabled: on })),
            plugin ? null : act('Remove', async () => { await sendJSON(`/api/skills/${s.id}`, 'DELETE'); await load(); }, 'btn btn-danger btn-sm'),
          ],
        }));
      }
    } else {
      for (const p of data.plugins.filter((p) => matches(p.name, p.description))) {
        const n = (p.connectors?.length ?? 0) + (p.skills?.length ?? 0);
        list.append(row({
          id: p.id,
          name: p.name, sub: p.description, type: 'Plugin', typeTag: `${n} items`,
          status: 'Installed', statusClass: 'text-ok',
          actions: [act('Uninstall', async (e) => { e.currentTarget.disabled = true; e.currentTarget.textContent = 'Removing…'; await uninstall(p); }, 'btn btn-danger btn-sm')],
        }));
      }
    }
  }

  function paintDiscover() {
    const list = $('cz-list');
    const have = (url) => data.connectors.some((c) => c.url === url);
    const haveSkill = (name) => data.skills.some((s) => s.name === name);
    const havePlugin = (name) => data.plugins.some((p) => p.name === name);
    for (const item of CATALOG[view.kind].filter((i) => matches(i.name, i.desc ?? i.description))) {
      let added; let add;
      if (view.kind === 'connectors') { added = have(item.url); add = () => sendJSON('/api/mcp', 'POST', { name: item.name, url: item.url, enabled: true }); }
      else if (view.kind === 'skills') { added = haveSkill(item.name); add = () => sendJSON('/api/skills', 'POST', { ...item, enabled: true }); }
      else { added = havePlugin(item.name); add = () => install(item); }
      list.append(row({
        name: item.name, sub: item.desc ?? item.description,
        type: view.kind === 'connectors' ? 'Remote' : view.kind === 'skills' ? 'Skill' : 'Plugin', typeTag: 'No sign-in',
        status: added ? '✓ Added' : '', statusClass: added ? 'text-ok' : '',
        actions: [added ? null : act('Add', async (e) => {
          const button = e.currentTarget;
          if (button.disabled) return;
          button.disabled = true; button.textContent = 'Adding…'; showError('');
          try { await add(); } catch (err) { showError(`${item.name} could not be added: ${err.message}`); }
          await load();
        }, 'btn btn-sm')],
      }));
    }
  }

  function paint() {
    const list = $('cz-list');
    list.replaceChildren();
    shownIds = [];
    $('cz-all').hidden = view.scope !== 'yours';
    $('cz-col-name').textContent = { connectors: 'Connector', skills: 'Skill', plugins: 'Plugin' }[view.kind];
    if (view.scope === 'yours') paintYours(); else paintDiscover();
    const empty = !list.children.length;
    $('cz-note').textContent = notice ? notice : empty
      ? (view.q ? 'Nothing matches that search.'
        : view.scope === 'yours' ? `No ${view.kind} yet. Add one, or look in Discover.` : 'Nothing to discover here yet.')
      : view.kind === 'connectors' ? 'The tools of every connector that is on are offered to the model in your chats.'
      : view.kind === 'skills' ? 'Skills that are on are added to the model’s instructions in every chat.'
      : 'Uninstalling a plugin removes the connectors and skills it added.';
    paintBulk();
  }

  function paintBulk() {
    for (const id of [...picked]) if (!idsOf(view.kind).includes(id)) picked.delete(id);
    const n = picked.size;
    $('cz-bulk').hidden = n === 0;
    $('cz-bulk-count').textContent = `${n} selected`;
    const all = $('cz-all');
    all.checked = shownIds.length > 0 && shownIds.every((id) => picked.has(id));
    all.indeterminate = !all.checked && shownIds.some((id) => picked.has(id));
    const plugins = view.kind === 'plugins';
    $('cz-bulk').querySelector('[data-bulk="on"]').hidden = plugins;
    $('cz-bulk').querySelector('[data-bulk="off"]').hidden = plugins;
    $('cz-bulk').querySelector('[data-bulk="remove"]').textContent = plugins ? 'Uninstall' : 'Remove';
    const owned = plugins ? 0 : [...picked].filter((id) => pluginOf(view.kind, id)).length;
    $('cz-bulk-note').textContent = owned ? `${owned} from plugins: uninstall the plugin to remove them` : '';
  }

  function idsOf(kind) {
    return kind === 'plugins' ? data.plugins.map((p) => p.id) : data[kind].map((x) => x.id);
  }

  // ---- plugins: the server adds and removes every part, one plugin at a time, from its own list (W4-10) ----
  const install = (bundle) => sendJSON('/api/plugins', 'POST', bundle);

  // A failure is shown in words in a line under the list, never swallowed.
  function showError(text) {
    const box = $('cz-error');
    box.textContent = text || '';
    box.hidden = !text;
  }
  async function uninstall(plugin) {
    showError('');
    try {
      await sendJSON(`/api/plugins/${plugin.id}`, 'DELETE');
    } catch (err) {
      showError(`${plugin.name} could not be uninstalled: ${err.message}`);
      await load();
      return false;
    }
    await load();
    return true;
  }

  // ---- controls ----
  document.querySelectorAll('.cz-tab').forEach((b) => b.addEventListener('click', () => {
    view.kind = b.dataset.kind;
    picked.clear();
    document.querySelectorAll('.cz-tab').forEach((t) => { t.classList.toggle('is-active', t === b); t.setAttribute('aria-selected', String(t === b)); });
    paint();
  }));
  document.querySelectorAll('.cz-scope button').forEach((b) => b.addEventListener('click', () => {
    view.scope = b.dataset.scope;
    document.querySelectorAll('.cz-scope button').forEach((t) => { t.classList.toggle('is-active', t === b); t.setAttribute('aria-pressed', String(t === b)); });
    paint();
  }));
  $('cz-search').addEventListener('input', (e) => { view.q = e.target.value.trim().toLowerCase(); paint(); });
  $('cz-all').addEventListener('change', (e) => {
    for (const id of shownIds) { if (e.target.checked) picked.add(id); else picked.delete(id); }
    paint();
  });
  $('cz-bulk').addEventListener('click', async (e) => {
    const action = e.target.closest('[data-bulk]')?.dataset.bulk;
    if (!action) return;
    if (action === 'clear') { picked.clear(); paint(); return; }
    const ids = [...picked];
    const kind = view.kind;
    if (action === 'remove') {
      const removable = kind === 'plugins' ? ids : ids.filter((id) => !pluginOf(kind, id));
      if (!removable.length) return;
      const what = kind === 'plugins' ? 'Uninstall' : 'Remove';
      if (!window.confirm(`${what} ${removable.length} ${kind === 'plugins' ? 'plugin' : kind.slice(0, -1)}${removable.length === 1 ? '' : 's'}?`)) return;
    }
    const buttons = $('cz-bulk').querySelectorAll('button');
    buttons.forEach((b) => { b.disabled = true; });
    $('cz-bulk-note').textContent = 'Working…';
    try {
      if (kind === 'plugins') {
        for (const id of ids) { const p = data.plugins.find((x) => x.id === id); if (p && !(await uninstall(p))) break; }
      } else {
        const base = kind === 'connectors' ? '/api/mcp' : '/api/skills';
        for (const id of ids) {
          if (action === 'remove') { if (!pluginOf(kind, id)) await sendJSON(`${base}/${id}`, 'DELETE'); }
          else await sendJSON(`${base}/${id}`, 'PATCH', { enabled: action === 'on' });
        }
      }
    } finally {
      buttons.forEach((b) => { b.disabled = false; });
      picked.clear();
      await load();
    }
  });

  const addMenu = $('cz-add-menu');
  $('cz-add').addEventListener('click', (e) => {
    e.stopPropagation();
    addMenu.hidden = !addMenu.hidden;
    $('cz-add').setAttribute('aria-expanded', String(!addMenu.hidden));
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.cz-add-wrap')) addMenu.hidden = true; });
  addMenu.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', () => {
    addMenu.hidden = true;
    document.querySelectorAll('.cz-form').forEach((f) => { f.hidden = true; });
    if (b.dataset.add === 'connector') { $('cz-connector-form').hidden = false; $('cz-connector-form').elements.namedItem('title').focus(); }
    if (b.dataset.add === 'skill') { $('cz-skill-form').hidden = false; $('cz-skill-form').elements.namedItem('title').focus(); }
    if (b.dataset.add === 'plugin') $('cz-plugin-file').click();
    if (b.dataset.add === 'github') { $('cz-github-form').hidden = false; $('cz-github-form').elements.namedItem('url').focus(); }
  }));
  document.querySelectorAll('[data-cancel]').forEach((b) => b.addEventListener('click', () => { b.closest('form').hidden = true; }));

  async function submit(form, url, body, kind) {
    const err = form.querySelector('[data-err]');
    err.textContent = '';
    try {
      const added = await sendJSON(url, 'POST', body); // (through the window's own channel in the desktop app: adding a connector is window-only)
      if (kind === 'connectors' && added?.id) await fetch(`/api/mcp/${added.id}/tools`).catch(() => {}); // a 401 marks it "Needs sign-in"
      form.reset(); form.hidden = true;
      view.kind = kind; view.scope = 'yours';
      document.querySelector(`.cz-tab[data-kind="${kind}"]`).click();
      document.querySelector('.cz-scope [data-scope="yours"]').click();
      await load();
    } catch (e) { err.textContent = e.message; }
  }
  $('cz-connector-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.currentTarget;
    submit(f, '/api/mcp', { name: f.elements.namedItem('title').value, url: f.elements.namedItem('url').value, enabled: true }, 'connectors');
  });
  $('cz-skill-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.currentTarget;
    submit(f, '/api/skills', { name: f.elements.namedItem('title').value, description: f.elements.namedItem('description').value, instructions: f.elements.namedItem('instructions').value, enabled: true }, 'skills');
  });
  $('cz-github-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.currentTarget;
    const err = f.querySelector('[data-err]');
    const btn = f.querySelector('[type="submit"]');
    err.textContent = ''; btn.textContent = 'Installing…'; btn.disabled = true;
    try {
      const out = await sendJSON('/api/plugins/install', 'POST', { url: f.elements.namedItem('url').value });
      f.reset(); f.hidden = true;
      document.querySelector('.cz-tab[data-kind="plugins"]').click();
      document.querySelector('.cz-scope [data-scope="yours"]').click();
      await load();
      $('cz-note').textContent = `Installed ${out.plugin.name}.` + (out.skipped?.length ? ` Skipped: ${out.skipped.join(', ')}.` : '');
    } catch (ex) { err.textContent = ex.message; }
    finally { btn.textContent = 'Install'; btn.disabled = false; }
  });
  $('cz-plugin-file').addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    e.target.value = '';
    if (!file) return;
    try {
      const bundle = JSON.parse(await file.text());
      await install(bundle);
      document.querySelector('.cz-tab[data-kind="plugins"]').click();
      document.querySelector('.cz-scope [data-scope="yours"]').click();
      await load();
    } catch (err) {
      showError(`That plugin could not be installed: ${err.message}`);
    }
  });

  load();
</script>
</body>
</html>
