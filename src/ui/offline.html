<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunny is not running</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bunny">
<style>
  :root { color-scheme: light dark; --bg: #faf9f6; --text: #1f2023; --dim: #62666f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141518; --text: #ececee; --dim: #a0a2aa; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, "Segoe UI", sans-serif; padding: 24px; text-align: center; }
  main { max-width: 460px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0; color: var(--dim); }
</style>
</head>
<body>
<main role="alert">
  <h1>Bunny is not running</h1>
  <p>Bunny runs on this computer and has been closed. Open Bunny again (or turn on Keep running in the tray in Settings, under Desktop app, so closing the window does not stop it). This page comes back by itself.</p>
</main>
<script src="/src/ui/offline.js"></script>
</body>
</html>
