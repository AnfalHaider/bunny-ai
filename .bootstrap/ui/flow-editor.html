<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Flow</title>
<style>
:root{
  --paper:#F6F4EF;--card:#FFFFFF;--sunk:#EFECE5;--ink:#1D1B18;--ink2:#524E47;--ink3:#7D776D;--line:#E2DDD3;--line2:#CCC6B9;
  --accent:#9A3B1E;--accent-ink:#FFFFFF;--accent-soft:#F4E3DA;
  --ok:#2C6E49;--ok-soft:#E2F0E7;--warn:#8A5A00;--warn-soft:#FBEFD5;--bad:#A12C2C;--bad-soft:#F7E1E1;
  --on:#2C6E49;--opt:#8A5A00;--off:#A8A296;
  --display:Georgia,"Iowan Old Style","Times New Roman",serif;--text:"Segoe UI",system-ui,-apple-system,sans-serif;--mono:Consolas,"SF Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(30,25,15,.05),0 4px 16px rgba(30,25,15,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#131311;--card:#1C1C19;--sunk:#171715;--ink:#ECE9E2;--ink2:#B9B4A9;--ink3:#8C877C;--line:#2D2C28;--line2:#3E3C36;--accent:#E07A52;--accent-ink:#1B120D;--accent-soft:#3A2419;--ok:#6BC28E;--ok-soft:#16281D;--warn:#E8C778;--warn-soft:#2E2614;--bad:#F08A8A;--bad-soft:#341818;--on:#6BC28E;--opt:#E8C778;--off:#5E5A52;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#131311;--card:#1C1C19;--sunk:#171715;--ink:#ECE9E2;--ink2:#B9B4A9;--ink3:#8C877C;--line:#2D2C28;--line2:#3E3C36;--accent:#E07A52;--accent-ink:#1B120D;--accent-soft:#3A2419;--ok:#6BC28E;--ok-soft:#16281D;--warn:#E8C778;--warn-soft:#2E2614;--bad:#F08A8A;--bad-soft:#341818;--on:#6BC28E;--opt:#E8C778;--off:#5E5A52;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--paper);color:var(--ink);font:14.5px/1.55 var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font:12.5px var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:0 5px}

/* header */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font:600 21px var(--display);margin:0;letter-spacing:-.01em}
.brand .where{font:12px var(--mono);color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
nav a{color:var(--ink2);text-decoration:none;padding:6px 11px;border-radius:8px;white-space:nowrap;font-size:13.5px}
nav a:hover{background:var(--sunk);color:var(--ink)}
.icon-btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}

/* layout */
main{max-width:1180px;margin:0 auto;padding:28px 20px 120px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.col{display:flex;flex-direction:column;gap:40px;min-width:0}
aside{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
section h2{font:600 22px var(--display);margin:0 0 4px;letter-spacing:-.01em}
section .lede{color:var(--ink2);margin:0 0 18px;max-width:64ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

/* hero */
.hero{padding:22px 22px 14px}
.hero h2{font-size:26px}
.hero svg{width:100%;height:auto;display:block;margin-top:6px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);padding:4px 2px 0}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--on);vertical-align:middle;margin-right:6px}
.legend i.opt{border-top:2px dashed var(--opt)}
svg .n rect{fill:var(--card);stroke-width:1.5}
svg .n text{font:600 13px var(--text);fill:var(--ink)}
svg .n.on rect{stroke:var(--on)}
svg .n.optional rect{stroke:var(--opt);stroke-dasharray:5 4}
svg .n.optional text{fill:var(--ink2);font-weight:500}
svg .n{cursor:pointer}
svg .n:hover rect{fill:var(--sunk)}
svg .edge{fill:none;stroke-width:1.5}
svg .edge.on{stroke:var(--on);opacity:.55}
svg .edge.optional{stroke:var(--opt);stroke-dasharray:5 5;opacity:.6}
svg .cos rect{fill:var(--accent);stroke:none}
svg .cos text{fill:var(--accent-ink);font:600 15px var(--display)}
svg .you circle{fill:var(--ink)}
svg .you text{fill:var(--paper);font:600 13px var(--text)}
svg .lbl{font:12px var(--text);fill:var(--ink3)}
svg .main-edge{stroke:var(--ink);stroke-width:2;fill:none}

/* team */
.sub{font:600 12px var(--text);text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin:18px 0 10px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.role{padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.role.is-off{background:var(--sunk);box-shadow:none}
.role.is-off .rname,.role.is-off .job{opacity:.6}
.rtop{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--off)}
.is-on .dot{background:var(--on)} .is-optional .dot{background:transparent;border:2px solid var(--opt)}
.rname{font-weight:600}
.rmodel{margin-left:auto;font-size:11.5px;color:var(--ink3)}
.job{color:var(--ink2);font-size:13px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:4px 0;border-radius:7px;font-size:12.5px;color:var(--ink2)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button[aria-pressed=true][data-v=on]{color:var(--on)}
.seg button[aria-pressed=true][data-v=optional]{color:var(--opt)}
.locked{font-size:12.5px;color:var(--accent);font-weight:600;padding:5px 0 1px}
details.tools summary{cursor:pointer;font-size:12.5px;color:var(--ink3);list-style:none}
details.tools summary::before{content:"+ "} details.tools[open] summary::before{content:"− "}
details.tools textarea{margin-top:6px}

/* rules + lanes */
.stack{display:flex;flex-direction:column;gap:12px}
.rule{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:start}
.rule h3,.lane h3{margin:0;font-size:15px}
.rule .when{color:var(--ink2);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip.static{cursor:default}
.word{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 11px;font-weight:600}
.word.soft{background:var(--sunk);color:var(--ink2);border:1px solid var(--line);font-weight:500}
.globs{grid-column:1/-1}
.globs summary{cursor:pointer;font-size:12.5px;color:var(--ink3)}
textarea{width:100%;border:1px solid var(--line2);background:var(--paper);border-radius:9px;padding:8px 10px;resize:vertical;font:12.5px/1.6 var(--mono)}
select,input[type=number]{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:5px 9px}
.lane{padding:16px;display:flex;flex-direction:column;gap:12px}
.lhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lhead .when{color:var(--ink3);font-size:13px}
.pipe{display:flex;align-items:center;flex-wrap:wrap;row-gap:8px;padding:2px 0}
.step{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:5px 10px;font-size:12.5px;white-space:nowrap}
.step.gate{background:var(--sunk);font-weight:600;border-style:dashed}
.step.w{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.step.off{opacity:.45;text-decoration:line-through}
.arrow{flex:none;width:18px;height:1px;background:var(--line2);position:relative}
.arrow::after{content:"";position:absolute;right:-1px;top:-3px;border:3.5px solid transparent;border-left:5px solid var(--line2)}
.row{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.row .k{font-size:12.5px;color:var(--ink3);min-width:118px}

/* helpers */
.helpers{padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--card)}
.stepper button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;font-size:17px;color:var(--ink2)}
.stepper button:hover{background:var(--sunk)}
.stepper b{min-width:34px;text-align:center;font:600 18px var(--display)}
.hk{font-size:12.5px;color:var(--ink3);margin-bottom:6px}
.hnote{font-size:12.5px;color:var(--ink2);margin:8px 0 0}

/* aside */
.panel{padding:16px}
.panel h3{margin:0 0 4px;font:600 16px var(--display)}
.panel p{margin:0 0 10px;color:var(--ink2);font-size:13px}
.checks{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.checks input{margin-top:3px;accent-color:var(--accent)}
.result{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.result .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.finding{display:flex;gap:8px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.finding:first-of-type{border-top:0}
.lv{flex:none;font-size:11px;font-weight:700;text-transform:uppercase;border-radius:5px;padding:1px 6px;height:fit-content}
.lv.error{background:var(--bad-soft);color:var(--bad)}.lv.warning{background:var(--warn-soft);color:var(--warn)}.lv.info{background:var(--sunk);color:var(--ink2)}.lv.ok{background:var(--ok-soft);color:var(--ok)}

/* save bar */
.savebar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);transition:transform .25s ease;z-index:20;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.savebar.show{transform:translate(-50%,0)}
.savebar span{font-size:13.5px}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:inherit;opacity:.8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);z-index:30;max-width:min(560px,calc(100vw - 32px));font-size:13.5px}
.toast b{display:block;margin-bottom:2px}

@media (max-width:980px){main{grid-template-columns:minmax(0,1fr)}aside{position:static}}
@media (max-width:640px){.hwrap{padding:10px 16px;flex-wrap:nowrap}main{padding:20px 16px 120px}nav{display:none}.rule{grid-template-columns:1fr}.brand .where{display:none}#theme{margin-left:auto}.hero h2{font-size:22px}.savebar{left:16px;right:16px;transform:translateY(140%)}.savebar.show{transform:none}.savebar span{flex:1}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand"><h1>Project flow</h1><span class="where" id="where"></span></div>
  <nav aria-label="Sections"><a href="#team">Team</a><a href="#checks">Extra checks</a><a href="#work">Kinds of work</a><a href="#helpers">Helpers</a></nav>
  <button class="icon-btn" id="theme" title="Light or dark" aria-label="Switch light or dark">◐</button>
</div></header>

<main>
  <div class="col" id="col"><div class="card hero"><p>Loading…</p></div></div>
  <aside id="aside"></aside>
</main>

<div class="savebar" id="savebar" role="region" aria-label="Unsaved changes">
  <span id="savemsg">You have unsaved changes</span>
  <button class="btn ghost" id="undo">Discard</button>
  <button class="btn primary" id="save">Save</button>
</div>

<script>
const TOKEN = '__FLOW_TOKEN__';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = async (path, body) => {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'x-flow-token': TOKEN, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json(); if (!r.ok) throw Object.assign(new Error(j.error || r.status), j); return j;
};

let S = null, saved = null, sim = { condIds: [], docsOnly: false, laneId: '' }, simResult = null, timer = null;
const isCompany = () => S.mode === 'company';
const L = () => isCompany() ? (S.company.defaults ||= {}) : S.project;     // the layer this page edits
const F = () => S.flow;                                                     // the merged flow (what is enforced)
const br = () => F().branches || { live: 'main', dev: 'dev' };
const shared = () => br().dev || br().live;   // where sign-offs are checked
const name = (id) => (F().roles[id] ? F().roles[id].name : id);
const CORE = ['chief-of-staff'];
const MODELS = { haiku: 'Cheapest (Haiku)', sonnet: 'Mid (Sonnet)', opus: 'Strongest (Opus)' };
const dirty = () => JSON.stringify(isCompany() ? S.company : S.project) !== saved;
const famOf = (id) => (id === 'chief-of-staff' ? 'on' : (F().family || {})[id] || 'optional');
const roleIds = () => Object.keys(F().roles).filter((id) => F().roles[id].class !== 'lane').sort((a, b) => (a === 'chief-of-staff' ? -1 : b === 'chief-of-staff' ? 1 : 0) || ({ on: 0, optional: 1, off: 2 }[famOf(a)] - { on: 0, optional: 1, off: 2 }[famOf(b)]) || name(a).localeCompare(name(b)));

function changed() {
  render(); $('#savebar').classList.toggle('show', dirty());
  clearTimeout(timer);
  timer = setTimeout(async () => {
    try { const st = await api('/api/check', isCompany() ? { company: S.company } : { project: S.project }); S.flow = st.flow; S.findings = st.findings; render(); runSim(); }
    catch (e) { toast('Could not check', e.message); }
  }, 180);
}
function laneLayer(id) { const l = (L().lanes ||= []); let x = l.find((z) => z.id === id); if (!x) { x = { id }; l.push(x); } return x; }
function condLayer(id) { const l = (L().conditions ||= []); let x = l.find((z) => z.id === id); if (!x) { x = { id }; l.push(x); } return x; }

// ---------- the picture: you → Chief of Staff → sessions ----------
function hub() {
  const ids = roleIds().filter((id) => id !== 'chief-of-staff' && famOf(id) !== 'off');
  const W = 760, H = 340, cx = 400, cy = 178, rx = 270, ry = 128;
  const n = ids.length, a0 = -150, a1 = 150;
  const nodes = ids.map((id, i) => {
    const a = ((n === 1 ? 0 : a0 + (a1 - a0) * (i / (n - 1))) * Math.PI) / 180;
    const label = name(id); const w = Math.max(74, label.length * 7.6 + 26);
    return { id, label, w, x: cx + rx * Math.cos(a) + 30, y: cy + ry * Math.sin(a), st: famOf(id) };
  });
  const edges = nodes.map((p) => `<path class="edge ${p.st}" d="M${cx + 30} ${cy} Q ${(cx + 30 + p.x) / 2} ${(cy + p.y) / 2 - 10} ${p.x} ${p.y}"/>`).join('');
  const boxes = nodes.map((p) => `<g class="n ${p.st}" data-go="role-${esc(p.id)}" tabindex="0" role="button" aria-label="${esc(p.label)}, ${p.st}"><rect x="${p.x - p.w / 2}" y="${p.y - 15}" width="${p.w}" height="30" rx="15"/><text x="${p.x}" y="${p.y + 4.5}" text-anchor="middle">${esc(p.label)}</text></g>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="You talk to the Chief of Staff; it routes work to ${n} sessions">
    <path class="main-edge" d="M78 ${cy} L ${cx - 46} ${cy}"/>
    <text class="lbl" x="${(78 + cx - 46) / 2}" y="${cy - 10}" text-anchor="middle">you talk here</text>
    ${edges}
    <g class="you"><circle cx="50" cy="${cy}" r="28"/><text x="50" y="${cy + 4.5}" text-anchor="middle">You</text></g>
    <g class="cos"><rect x="${cx - 46}" y="${cy - 24}" width="152" height="48" rx="24"/><text x="${cx + 30}" y="${cy + 5}" text-anchor="middle">Chief of Staff</text></g>
    ${boxes}
  </svg>`;
}

function teamCard(id) {
  const r = F().roles[id], st = famOf(id), locked = CORE.includes(id);
  const srcs = ((L().roles || {})[id] || {}).sources || [];
  const seg = ['on', 'optional', 'off'].map((v) => `<button data-act="fam" data-id="${esc(id)}" data-v="${v}" aria-pressed="${st === v}">${{ on: 'On', optional: 'Optional', off: 'Off' }[v]}</button>`).join('');
  return `<div class="card role is-${st}" id="role-${esc(id)}">
    <div class="rtop"><span class="dot"></span><span class="rname">${esc(r.name)}</span><span class="rmodel">${esc(r.model || '')}</span></div>
    <p class="job" title="${esc(r.job)}">${esc(r.job || 'No job written yet.')}</p>
    ${locked ? '<div class="locked">Always on · you talk here</div>' : `<div class="seg" role="group" aria-label="${esc(r.name)} session">${seg}</div>`}
    <details class="tools"><summary>Tools from GitHub${srcs.length ? ` (${srcs.length})` : ''}</summary>
      <textarea rows="2" data-act="src" data-id="${esc(id)}" placeholder="github.com/owner/repo, one per line">${esc(srcs.join('\n'))}</textarea></details>
  </div>`;
}

function ruleCard(c) {
  const signers = roleIds().filter((id) => !['chief-of-staff', 'builder', 'hotfix'].includes(id) && famOf(id) !== 'off');
  const words = Object.keys(F().words);
  return `<div class="card rule">
    <div><h3>${esc(c.label)}</h3><div class="when">When a piece changes files like ${(c.globs || []).slice(0, 2).map((g) => `<code>${esc(g)}</code>`).join(' ')}${(c.globs || []).length > 2 ? ` and ${(c.globs.length - 2)} more` : ''}</div></div>
    <div class="row" style="justify-content:flex-end"><select data-act="cword" data-id="${esc(c.id)}" aria-label="Your word needed">
      <option value="">No extra word from you</option>${words.map((w) => `<option value="${esc(w)}" ${c.require_word === w ? 'selected' : ''}>You say "${esc(w)}" first</option>`).join('')}</select></div>
    <div class="globs" style="grid-column:1/-1"><div class="row"><span class="k">Must also sign</span><div class="chips">${signers.map((id) => `<button class="chip" data-act="creq" data-id="${esc(c.id)}" data-r="${esc(id)}" aria-pressed="${(c.require || []).includes(id)}">${esc(name(id))}</button>`).join('')}</div></div></div>
    <details class="globs"><summary>Edit the files that count</summary><textarea rows="3" data-act="globs" data-id="${esc(c.id)}">${esc((c.globs || []).join('\n'))}</textarea></details>
  </div>`;
}

function laneCard(l) {
  const signers = roleIds().filter((id) => !['builder', 'hotfix'].includes(id) && famOf(id) !== 'off');
  const steps = (l.stages || []).map((s) => {
    if (s.kind === 'gate') return `<span class="step gate">${esc(s.title)}</span>`;
    if (s.kind === 'word') return `<span class="step w">${esc(s.title)}</span>`;
    return `<span class="step ${famOf(s.role) === 'off' ? 'off' : ''}" title="${esc(name(s.role))}: ${esc(s.produces || '')}">${esc(s.title)}</span>`;
  }).join('<span class="arrow"></span>');
  const exempt = l.live_exempt_signoffs;
  return `<div class="card lane">
    <div class="lhead"><h3>${esc(l.name)}</h3><span class="when">${esc(l.when || '')}</span></div>
    <div class="pipe">${steps}</div>
    ${exempt ? '<div class="row"><span class="k">Sign-offs</span><span class="chip static">None: it goes straight to your word</span></div>'
      : `<div class="row"><span class="k">Signs before ${esc(shared())}</span><div class="chips">${signers.map((id) => `<button class="chip" data-act="lsig" data-id="${esc(l.id)}" data-r="${esc(id)}" aria-pressed="${(l.dev_signoffs || []).includes(id)}">${esc(name(id))}</button>`).join('')}</div></div>`}
    <div class="row"><span class="k">Goes live when</span><span class="word">you say "${esc(l.live_word || '?')}"</span>${F().words[l.live_word] && F().words[l.live_word].relay ? '<span class="word soft">to the Chief of Staff, who relays it</span>' : '<span class="word soft">typed in the session that pushes</span>'}</div>
  </div>`;
}

function helpersCard() {
  const h = F().helpers || { max_per_session: 2, model: 'haiku' };
  return `<div class="card helpers">
    <div><div class="hk">Most helpers one session may start</div>
      <div class="stepper"><button data-act="hmax" data-d="-1" aria-label="Fewer">−</button><b>${h.max_per_session}</b><button data-act="hmax" data-d="1" aria-label="More">+</button></div>
      <p class="hnote">${h.max_per_session === 0 ? 'Sessions do all their work themselves.' : `A ${h.max_per_session + 1}${h.max_per_session === 1 ? 'nd' : h.max_per_session === 2 ? 'rd' : 'th'} helper is refused by the guard.`}</p></div>
    <div><div class="hk">Model helpers must use</div>
      <select data-act="hmodel" aria-label="Helper model">${Object.entries(MODELS).map(([k, v]) => `<option value="${k}" ${h.model === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <p class="hnote">A helper asking for a bigger model is refused. Each session starts helpers only when the work needs one.</p></div>
  </div>`;
}

function render() {
  const f = F(), on = roleIds().filter((id) => famOf(id) === 'on').length, opt = roleIds().filter((id) => famOf(id) === 'optional').length;
  $('#where').textContent = isCompany() ? `Company defaults · ${S.root}` : S.root;
  $('#col').innerHTML = `
  <section class="card hero" aria-labelledby="h-hero">
    <h2 id="h-hero">You talk to one session</h2>
    <p class="lede" style="margin-bottom:4px">The Chief of Staff routes work to the family below, gets their reports, and relays your decisions. ${on} sessions are on; ${opt} start only when the Chief of Staff needs them or you ask.</p>
    ${hub()}
    <div class="legend"><span><i></i>On from the start</span><span><i class="opt"></i>Optional: started when needed</span></div>
  </section>
  <section id="team"><h2>Team</h2><p class="lede">Choose who runs from the start. <b>Optional</b> sessions are started by the Chief of Staff when the work needs them, or when you ask. Rules below can still require their sign-off.</p>
    <h3 class="sub">On from the start</h3><div class="team">${roleIds().filter((id) => famOf(id) === 'on').map(teamCard).join('')}</div>
    <h3 class="sub">Optional or off</h3><div class="team">${roleIds().filter((id) => famOf(id) !== 'on').map(teamCard).join('')}</div></section>
  <section id="checks"><h2>Extra checks</h2><p class="lede">When a piece touches certain files, more sessions must sign before it reaches <code>${esc(shared())}</code>. This is how optional sessions like Security are brought in automatically.</p>
    <div class="stack">${f.conditions.map(ruleCard).join('')}</div></section>
  <section id="work"><h2>Kinds of work</h2><p class="lede">${br().dev ? `Work is shared on <code>${esc(br().dev)}</code> and goes live on <code>${esc(br().live)}</code>.` : `This project has no dev branch: pieces go to <code>${esc(br().live)}</code> through a release, and sign-offs are checked there.`} Each piece follows one of these. The Chief of Staff picks it; the push check enforces who signs and which of your words is on record.</p>
    <div class="stack">${f.lanes.map(laneCard).join('')}</div></section>
  <section id="helpers"><h2>Helpers</h2><p class="lede">Sessions may start small helper agents for side jobs like searching or summarising.</p>${helpersCard()}</section>`;
  renderAside();
}

function renderAside() {
  const f = F(), r = simResult;
  const findings = (S.findings || []).filter((x) => x.level !== 'ok');
  const oks = (S.findings || []).filter((x) => x.level === 'ok');
  $('#aside').innerHTML = `
  <div class="card panel"><h3>Try a change</h3><p>Pick what a change touches to see who signs and what you are asked.</p>
    <div class="checks">${f.conditions.map((c) => `<label><input type="checkbox" data-act="simc" value="${esc(c.id)}" ${sim.condIds.includes(c.id) ? 'checked' : ''}>${esc(c.label)}</label>`).join('')}
      <label><input type="checkbox" data-act="simd" ${sim.docsOnly ? 'checked' : ''}>Only docs</label></div>
    <select data-act="siml" aria-label="Kind of work" style="width:100%;margin-bottom:12px"><option value="">Kind of work: let the Chief of Staff pick</option>${f.lanes.map((l) => `<option value="${esc(l.id)}" ${sim.laneId === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select>
    ${r ? `<div class="result">${r.docsOnly ? '<div>Docs-only commits ride along. No sign-offs needed.</div>' : `
      <div><div class="k">Follows</div>${esc(f.lanes.find((l) => l.id === r.lane)?.name || r.lane)}</div>
      <div><div class="k">Signs before ${esc(shared())}</div><div class="chips">${r.required.length ? r.required.map((id) => `<span class="chip static" ${r.added.includes(id) ? 'aria-pressed="true"' : ''}>${esc(name(id))}</span>`).join('') : 'Nobody'}</div></div>
      <div><div class="k">You are asked</div><div class="chips">${r.words.map((w) => `<span class="word">"${esc(w)}"</span>`).join('') || 'Nothing'}</div></div>`}</div>` : ''}
  </div>
  <div class="card panel"><h3>Checks</h3>
    ${findings.length ? findings.map((x) => `<div class="finding"><span class="lv ${x.level}">${x.level === 'warning' ? 'warn' : x.level}</span><div>${esc(x.msg)}${x.fix ? `<div style="color:var(--ink3)">${esc(x.fix)}</div>` : ''}</div></div>`).join('') : ''}
    ${oks.map((x) => `<div class="finding"><span class="lv ok">ok</span><div>${esc(x.msg)}</div></div>`).join('')}
  </div>
  <div class="card panel"><h3>After you save</h3><p style="margin:0">Tell the Chief of Staff <b>"apply the flow change"</b>. It reads the change back to you, records your yes, and pushes it. Nothing changes for the family until then.</p></div>`;
}

async function runSim() {
  try { simResult = await api('/api/simulate', { ...(isCompany() ? { company: S.company } : { project: S.project }), condIds: sim.condIds, docsOnly: sim.docsOnly && !sim.condIds.length, laneId: sim.laneId || null }); renderAside(); } catch { /* shown in checks */ }
}

document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]'); if (go) { document.getElementById(go.dataset.go)?.scrollIntoView({ block: 'center' }); return; }
  const t = e.target.closest('[data-act]'); if (!t || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.type === 'checkbox') return;
  const { act, id } = t.dataset;
  if (act === 'fam') { (L().family ||= {})[id] = t.dataset.v; return changed(); }
  if (act === 'lsig') { const lane = F().lanes.find((l) => l.id === id); const cur = new Set(lane.dev_signoffs || []); cur.has(t.dataset.r) ? cur.delete(t.dataset.r) : cur.add(t.dataset.r); laneLayer(id).dev_signoffs = [...cur]; return changed(); }
  if (act === 'creq') { const c = F().conditions.find((x) => x.id === id); const cur = new Set(c.require || []); cur.has(t.dataset.r) ? cur.delete(t.dataset.r) : cur.add(t.dataset.r); condLayer(id).require = [...cur]; return changed(); }
  if (act === 'hmax') { const h = { ...(F().helpers || {}), ...(L().helpers || {}) }; L().helpers = { ...(L().helpers || {}), max_per_session: Math.max(0, Math.min(5, (h.max_per_session ?? 2) + Number(t.dataset.d))) }; return changed(); }
});
document.addEventListener('keydown', (e) => { const g = e.target.closest?.('[data-go]'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
document.addEventListener('change', (e) => {
  const t = e.target, { act, id } = t.dataset;
  if (act === 'cword') { condLayer(id).require_word = t.value || null; return changed(); }
  if (act === 'hmodel') { L().helpers = { ...(L().helpers || {}), model: t.value }; return changed(); }
  if (act === 'globs') { condLayer(id).globs = t.value.split('\n').map((s) => s.trim()).filter(Boolean); return changed(); }
  if (act === 'src') { const roles = (L().roles ||= {}); roles[id] = { ...(roles[id] || {}), sources: t.value.split('\n').map((s) => s.trim()).filter(Boolean) }; return changed(); }
  if (act === 'simc') { sim.condIds = [...document.querySelectorAll('[data-act=simc]:checked')].map((x) => x.value); return runSim(); }
  if (act === 'simd') { sim.docsOnly = t.checked; return runSim(); }
  if (act === 'siml') { sim.laneId = t.value; return runSim(); }
});

function toast(title, msg) {
  document.querySelector('.toast')?.remove();
  const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status');
  d.innerHTML = `<b>${esc(title)}</b>${esc(msg || '')}`; document.body.append(d); setTimeout(() => d.remove(), 7000);
}
$('#save').onclick = async () => {
  $('#save').disabled = true;
  try {
    await api('/api/save', isCompany() ? { company: S.company } : { project: S.project });
    saved = JSON.stringify(isCompany() ? S.company : S.project); $('#savebar').classList.remove('show');
    toast('Saved', isCompany() ? ' Commit and push the company repo; projects pick it up with "check for updates".' : ' Now tell the Chief of Staff "apply the flow change". It reads the change back to you and records your yes.');
  } catch (err) { toast('Not saved', ` ${err.message}${err.findings ? ': ' + err.findings.filter((f) => f.level === 'error').map((f) => f.msg).join(' ') : ''}`); }
  $('#save').disabled = false;
};
$('#undo').onclick = async () => { const back = JSON.parse(saved); if (isCompany()) S.company = back; else S.project = back; changed(); };
$('#theme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('flow-theme', r.dataset.theme); } catch {} };
try { const t = localStorage.getItem('flow-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
window.addEventListener('beforeunload', (e) => { if (S && dirty()) { e.preventDefault(); e.returnValue = ''; } });

api('/api/state').then((st) => {
  S = st; if (isCompany()) S.company ||= { version: 1, name: 'Company' };
  saved = JSON.stringify(isCompany() ? S.company : S.project); render(); runSim();
}).catch((e) => { $('#col').innerHTML = `<div class="card hero"><h2>Could not load</h2><p class="lede">${esc(e.message)}. Ask the Chief of Staff to open the flow editor again; the link carries a one-time key.</p></div>`; });
</script>
</body>
</html>
