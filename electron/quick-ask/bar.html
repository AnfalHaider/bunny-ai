<!doctype html>
<html lang="en" data-pending>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; font-src 'self'">
<title>Bunny AI quick ask</title>
<style>
  /* QUICK-UI (v0.1.13, drawn in docs/design/review-v0113-quick-ask, version 2, option A): one light, airy pill, about 92% opaque, over a transparent window. No blur, no acrylic. */
  :root { color-scheme: light dark; --surface: rgba(255,255,255,.92); --solid: #ffffff; --text: #1f2024; --dim: #6b6e78; --line: rgba(31,32,36,.10); --accent: #6b4fd3; --ink: #1f2024; --ink-hi: #34363c; --on-ink: #ffffff; --soft: rgba(31,32,36,.05); --hover: rgba(31,32,36,.08); --warn: #b45309; --bad: #cf3f55; --warn-bg: rgba(180,83,9,.09); --bad-bg: rgba(207,63,85,.09); --font: system-ui, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surface: rgba(38,39,44,.92); --solid: #26272c; --text: #ececf0; --dim: #a3a6b1; --line: rgba(255,255,255,.11); --accent: #a592ff; --ink: #ececf0; --ink-hi: #ffffff; --on-ink: #1f2024; --soft: rgba(255,255,255,.06); --hover: rgba(255,255,255,.09); --warn: #e9ad52; --bad: #ff7a90; --warn-bg: rgba(233,173,82,.12); --bad-bg: rgba(255,122,144,.12); } }
  :root[data-theme="dark"] { color-scheme: dark; --surface: rgba(38,39,44,.92); --solid: #26272c; --text: #ececf0; --dim: #a3a6b1; --line: rgba(255,255,255,.11); --accent: #a592ff; --ink: #ececf0; --ink-hi: #ffffff; --on-ink: #1f2024; --soft: rgba(255,255,255,.06); --hover: rgba(255,255,255,.09); --warn: #e9ad52; --bad: #ff7a90; --warn-bg: rgba(233,173,82,.12); --bad-bg: rgba(255,122,144,.12); }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; font: 15px/1.5 var(--font); color: var(--text); overflow: hidden; }
  textarea, input, button { font-family: inherit; }
  /* the pill: 20 px radius, a hairline border, a soft shadow drawn inside the 8 px margin the window leaves for it */
  .bar { position: relative; margin: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 3px 10px rgba(20,22,40,.22), 0 1px 2px rgba(20,22,40,.10); }
  .row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 10px 0 16px; }
  .row.top { align-items: flex-start; padding-top: 9px; padding-bottom: 5px; min-height: 0; }
  .mk { width: 24px; height: 24px; color: var(--accent); flex: none; }
  .row.top .mk { margin-top: 7px; }
  textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 17px; line-height: 1.4; padding: 7px 0; height: 38px; max-height: 128px; overflow-y: auto; }
  textarea::placeholder { color: var(--dim); }
  /* the question once it is asked: at most three lines, the rest behind the line */
  .q { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 600; line-height: 1.4; padding: 7px 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  /* the buttons: 32 px round, 34 px for Send and Stop, in the page's ink colour */
  .ib2 { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--dim); background: transparent; border: 0; padding: 0; cursor: pointer; font: inherit; transition: background .16s, color .16s, transform .12s, opacity .16s; }
  .ib2:hover { background: var(--hover); color: var(--text); }
  .ib2:active { transform: scale(.94); }
  .act { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--ink); color: var(--on-ink); border: 0; padding: 0; cursor: pointer; transition: background .16s, transform .12s, opacity .16s; }
  .act:hover { background: var(--ink-hi); }
  .act:active { transform: scale(.94); }
  .ib2:focus-visible, .act:focus-visible, .ob2:focus-visible, .ghostbtn:focus-visible, .cpy:focus-visible, .latest:focus-visible, .linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ib2 svg, .act svg { display: block; }
  /* buttons appear only when they matter: they fade and scale in; the + is still reached by Tab while hidden (it shows when it has focus) */
  .reveal { opacity: 0; transform: scale(.85); width: 0; margin-left: -12px; overflow: hidden; pointer-events: none; transition: opacity .16s ease-out, transform .16s ease-out, width .16s ease-out, margin .16s ease-out; }
  .reveal.on, .reveal:focus, .reveal:focus-visible { opacity: 1; transform: none; margin-left: 0; pointer-events: auto; }
  .ib2.reveal.on, .ib2.reveal:focus, .ib2.reveal:focus-visible { width: 32px; }
  .act.reveal.on { width: 34px; }
  .chips { padding: 0 16px 8px 52px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 3px 6px 3px 4px; font-size: 13px; background: var(--soft); }
  .chip img { width: 34px; height: 22px; border-radius: 6px; object-fit: cover; }
  .chip button { border: 0; background: transparent; color: var(--dim); cursor: pointer; font-size: 16px; padding: 0 4px; }
  /* the keys, a quiet line: it appears with the first keystroke and stays through thinking and the answer */
  .keys { font-size: 12px; color: var(--dim); padding: 0 16px 10px 52px; display: flex; gap: 14px; flex-wrap: wrap; }
  .keys .push { margin-left: auto; }
  .msg { font-size: 13px; padding: 0 16px 10px 52px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .msg.is-problem { color: var(--warn); }
  .spin { width: 12px; height: 12px; flex: none; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .menu { position: absolute; left: 44px; top: 56px; background: var(--solid); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(20,22,40,.24); padding: 6px; min-width: 250px; z-index: 2; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 9px; cursor: pointer; }
  .menu button:hover, .menu button:focus { background: var(--hover); outline: 0; }
  .menu small { display: block; color: var(--dim); font-size: 12px; }
  .pcl { display: grid; gap: 6px; margin-top: 8px; }
  .pcl .pcs { color: var(--dim); font-size: 12px; }
  .pcr { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-width: 0; }
  .pcr.chosen { background: var(--hover); border-color: var(--accent, var(--line)); }
  .pcr .n { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
  .pcr .f, .pcr .d { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  .pcr .sn { font-size: 13px; overflow-wrap: anywhere; }
  .pcr mark { background: var(--hover); color: inherit; border-radius: 3px; padding: 0 2px; }
  .pcr .pa { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .pcr .pa button { border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; font-size: 12px; padding: 2px 8px; border-radius: 8px; cursor: pointer; }
  /* the answer opens downward from the same pill: no divider lines, no filled boxes */
  .collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease-out; }
  .collapse.on { grid-template-rows: 1fr; }
  .collapse > .inner { overflow: hidden; min-height: 0; }
  .body { position: relative; padding: 0 20px 2px 52px; }
  .ans { font-size: 15px; line-height: 1.65; max-height: 330px; overflow-y: auto; overflow-wrap: anywhere; padding-top: 2px; outline: 0; }
  .ans p { margin: 0 0 9px; } .ans ul, .ans ol { margin: 0 0 9px; padding-left: 20px; } .ans li { margin: 2px 0; }
  .ans code { font: 12.5px ui-monospace, Consolas, monospace; background: var(--soft); border-radius: 5px; padding: 0 5px; }
  .ans pre { position: relative; margin: 0 0 9px; background: var(--soft); border-radius: 12px; padding: 10px 14px; font: 12.5px/1.6 ui-monospace, Consolas, monospace; overflow-x: auto; }
  .ans pre code { background: transparent; padding: 0; }
  .ans .code-bar, .ans .code-foot, .ans .code-fold { display: none; }
  .cpy { position: absolute; top: 6px; right: 8px; font: 12px var(--font); color: var(--dim); background: var(--solid); border: 1px solid var(--line); border-radius: 8px; padding: 1px 9px; cursor: pointer; }
  .latest { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: var(--ink); color: var(--on-ink); border: 0; border-radius: 999px; font: 12px var(--font); padding: 3px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.25); cursor: pointer; }
  .caret { display: inline-block; width: 8px; height: 16px; background: var(--accent); border-radius: 2px; vertical-align: -3px; margin-left: 2px; }
  .think { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--dim); padding: 2px 0 8px; }
  .meta { font-size: 12px; color: var(--dim); padding: 2px 0 8px; }
  .earlier { display: flex; gap: 8px; align-items: center; padding: 0 20px 6px 52px; font-size: 12.5px; color: var(--dim); }
  .linkish { border: 0; background: transparent; color: var(--dim); font: inherit; font-size: 12.5px; cursor: pointer; padding: 2px 6px; margin-left: -6px; border-radius: 8px; }
  .linkish:hover { background: var(--hover); color: var(--text); }
  .earlier-list { max-height: 190px; overflow-y: auto; margin: 0 20px 8px 52px; display: grid; gap: 10px; }
  .earlier-list .eq { font-weight: 600; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .earlier-list .ea { font-size: 13px; color: var(--dim); overflow-wrap: anywhere; white-space: pre-wrap; max-height: 5.2em; overflow: hidden; }
  .foot { display: flex; align-items: center; gap: 10px; padding: 6px 12px 12px 52px; }
  .foot input { flex: 1; min-width: 0; height: 40px; border: 0; border-radius: 14px; padding: 0 14px; font: inherit; font-size: 14px; background: var(--soft); color: var(--text); outline: 0; }
  .foot input::placeholder { color: var(--dim); }
  .foot input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .foot input:disabled { opacity: .55; }
  .ob2 { display: inline-flex; align-items: center; gap: 8px; height: 36px; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--accent); background: transparent; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); cursor: pointer; }
  .ob2.fill { background: var(--accent); color: var(--solid); border-color: var(--accent); }
  .ob2 .kb { font: 11px ui-monospace, Consolas, monospace; opacity: .8; }
  .ghostbtn { display: inline-flex; align-items: center; height: 36px; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 13px; color: var(--text); background: var(--soft); border: 0; cursor: pointer; }
  .cardx { margin: 6px 20px 8px 52px; border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
  .cardx.warn { background: var(--warn-bg); } .cardx.bad { background: var(--bad-bg); }
  .cardx .t { font-weight: 600; } .cardx.warn .t { color: var(--warn); } .cardx.bad .t { color: var(--bad); }
  .cardx .b { font-size: 13.5px; } .cardx .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .copied { font-size: 12px; color: var(--dim); margin-right: 2px; align-self: center; }
  [hidden] { display: none !important; }
  /* hidden for the instant it takes to learn the theme, so the bar never flashes the wrong one (the page shows itself after at most 300 ms whatever happens) */
  html[data-pending] body { visibility: hidden; }
  /* nothing bounces, and all of it is off with reduced motion (the system's setting, or Bunny's own Motion setting passed in by the app) */
  @media (prefers-reduced-motion: reduce) {
    .reveal, .collapse, .ib2, .act, .spin { transition: none; animation: none; }
  }
  :root[data-motion="reduce"] .reveal, :root[data-motion="reduce"] .collapse, :root[data-motion="reduce"] .ib2, :root[data-motion="reduce"] .act, :root[data-motion="reduce"] .spin { transition: none; animation: none; }
  @media (prefers-reduced-motion: no-preference) { :root:not([data-motion="reduce"]) .caret { animation: blink 1.1s steps(2) infinite; } @keyframes blink { 50% { opacity: 0; } } }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="row" id="row">
    <svg class="mk" viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M24 16.5c8.6 0 15 5.9 15 13.4C39 37.6 32.6 43 24 43S9 37.6 9 29.9C9 22.4 15.4 16.5 24 16.5Z"/><g fill="currentColor"><rect x="16.4" y="4" width="6.2" height="21" rx="3.1" transform="rotate(-9 19.5 25)"/><rect x="25.4" y="4" width="6.2" height="21" rx="3.1" transform="rotate(9 28.5 25)"/></g></svg>
    <textarea id="text" rows="1" maxlength="20000" placeholder="What are we burrowing into?" aria-label="What are we burrowing into?" autofocus></textarea>
    <button class="ib2 reveal" id="plus" type="button" aria-label="Add" aria-haspopup="menu" aria-expanded="false"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ib2" id="copy" type="button" aria-label="Copy the answer" hidden></button>
    <button class="act reveal" id="go" type="button" aria-label="Send"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
  </div>
  <div class="chips" id="chips" hidden></div>
  <div class="keys" id="hint" hidden><span id="keyline"></span><span class="push" id="modelline" hidden></span></div>
  <div class="collapse" id="panel-wrap"><div class="inner">
    <div id="panel" hidden>
      <div class="earlier" id="earlier" hidden><button class="linkish" id="earlier-toggle" type="button" aria-expanded="false"></button></div>
      <div class="earlier-list" id="earlier-list" hidden></div>
      <div class="body"><div class="ans" id="ans" tabindex="0" aria-live="polite"></div><button class="latest" id="latest" type="button" hidden>↓ Latest</button></div>
      <div class="body"><div id="pc-list" class="pcl" hidden></div></div>
      <div class="body"><div class="meta" id="meta" hidden></div></div>
      <div id="card" hidden></div>
      <div class="foot" id="foot"><input id="follow" type="text" maxlength="20000" placeholder="Ask a follow-up…" aria-label="Ask a follow-up" disabled><button class="ob2" id="open" type="button">Open in Bunny <span class="kb">Ctrl+Enter</span></button></div>
    </div>
  </div></div>
  <div class="msg" id="msg" role="status" hidden></div>
  <div class="menu" id="menu" role="menu" hidden>
    <button type="button" role="menuitem" id="shot-item">Add a screenshot<small>Takes a picture of this screen when you choose it</small></button>
    <button type="button" role="menuitem" id="file-item">Add a file…<small>A picture, a PDF or a text file, up to 8 MB</small></button>
    <button type="button" role="menuitem" id="pc-item" hidden>Search this PC<small>Look for a file on this computer and tell you about it</small></button>
  </div>
</div>
<script type="module" src="bar.js"></script>
</body>
</html>
