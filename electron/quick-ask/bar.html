<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:">
<title>Bunny AI quick ask</title>
<style>
  :root { color-scheme: light dark; --surface: #ffffff; --text: #1f2024; --dim: #6b6e78; --line: #dcdce0; --accent: #6b4fd3; --ink: #1f2024; --on-ink: #ffffff; --warn: #b45309; --hover: #f0f0f3; --bg-side: #f6f6f8; }
  @media (prefers-color-scheme: dark) { :root { --surface: #26272c; --text: #ececf0; --dim: #a3a6b1; --line: #3a3c44; --accent: #a592ff; --ink: #ececf0; --on-ink: #1f2024; --warn: #e9ad52; --hover: #33353c; --bg-side: #2d2e34; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; color: var(--text); overflow: hidden; }
  .bar { position: relative; margin: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.28); padding: 10px 12px 8px; }
  .row { display: flex; align-items: flex-start; gap: 12px; min-height: 44px; }
  .mk { width: 30px; height: 30px; color: var(--accent); flex: none; margin-top: 7px; }
  .plus, .go { flex: none; margin-top: 6px; cursor: pointer; font: inherit; }
  .plus { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--dim); font-size: 20px; line-height: 1; }
  .go { width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--line); color: var(--dim); display: flex; align-items: center; justify-content: center; }
  .go.on { background: var(--ink); color: var(--on-ink); }
  textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 18px; line-height: 1.4; padding: 8px 0; height: 44px; max-height: 128px; overflow-y: auto; }
  textarea::placeholder { color: var(--dim); }
  .chips { padding: 8px 4px 0 46px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 6px 3px 4px; font-size: 13px; background: var(--bg-side); }
  .chip img { width: 34px; height: 22px; border-radius: 5px; object-fit: cover; }
  .chip button { border: 0; background: transparent; color: var(--dim); cursor: pointer; font-size: 16px; padding: 0 4px; }
  .hint { display: flex; gap: 14px; font-size: 12px; color: var(--dim); padding: 6px 4px 2px 46px; border-top: 1px solid var(--line); margin-top: 8px; }
  .msg { font-size: 13px; padding: 6px 4px 0 46px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .msg.is-problem { color: var(--warn); }
  .spin { width: 12px; height: 12px; flex: none; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .menu { position: absolute; left: 52px; top: 62px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.25); padding: 6px; min-width: 230px; z-index: 2; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .menu button:hover, .menu button:focus { background: var(--hover); outline: 0; }
  .menu small { display: block; color: var(--dim); font-size: 12px; }
  /* QA-ANSWERS: the answer panel (drawn in docs/design/review-v0110-quick-ask-answers) */
  .q { font-size: 16px; font-weight: 600; line-height: 1.4; padding: 8px 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .ibtn { width: 30px; height: 30px; margin-top: 7px; border: 0; border-radius: 8px; background: transparent; color: var(--dim); cursor: pointer; display: grid; place-items: center; flex: none; }
  .ibtn:hover, .ibtn:focus { background: var(--hover); outline: 0; }
  .stop { width: 34px; height: 34px; margin-top: 5px; border: 0; border-radius: 50%; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; flex: none; cursor: pointer; }
  .ans { border-top: 1px solid var(--line); margin-top: 6px; padding: 12px 4px 4px 46px; font-size: 14.5px; line-height: 1.65; max-height: 330px; overflow-y: auto; overflow-wrap: anywhere; }
  .ans p { margin: 0 0 9px; } .ans ul, .ans ol { margin: 0 0 9px; padding-left: 20px; } .ans li { margin: 2px 0; }
  .ans code { font: 12.5px ui-monospace, Consolas, monospace; background: var(--bg-side); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .ans pre { margin: 0 0 9px; background: var(--bg-side); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: 12.5px/1.6 ui-monospace, Consolas, monospace; overflow-x: auto; }
  .ans pre code { border: 0; padding: 0; background: transparent; }
  .ans .code-bar, .ans .code-foot, .ans .code-fold { display: none; }
  .caret { display: inline-block; width: 8px; height: 16px; background: var(--accent); border-radius: 2px; vertical-align: -3px; margin-left: 2px; }
  @media (prefers-reduced-motion: no-preference) { .caret { animation: blink 1.1s steps(2) infinite; } @keyframes blink { 50% { opacity: 0; } } }
  .meta { font-size: 12px; color: var(--dim); padding: 2px 4px 6px 46px; }
  .foot { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding: 10px 0 2px 46px; margin-top: 6px; }
  .foot input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; font: inherit; font-size: 14px; background: var(--bg-side); color: var(--text); outline: 0; }
  .foot input:disabled { opacity: .55; }
  .ob { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 10px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .ob.fill { background: var(--accent); color: var(--on-ink); }
  .ghostbtn { border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font: inherit; font-size: 13px; color: var(--text); background: var(--surface); cursor: pointer; }
  .cardx { margin: 10px 4px 4px 46px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; background: var(--bg-side); }
  .cardx.warn { border-color: var(--warn); } .cardx.bad { border-color: #cf3f55; }
  .cardx .t { font-weight: 600; } .cardx.warn .t { color: var(--warn); } .cardx.bad .t { color: #cf3f55; }
  .cardx .b { font-size: 13.5px; } .cardx .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="row">
    <svg class="mk" viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M24 16.5c8.6 0 15 5.9 15 13.4C39 37.6 32.6 43 24 43S9 37.6 9 29.9C9 22.4 15.4 16.5 24 16.5Z"/><g fill="currentColor"><rect x="16.4" y="4" width="6.2" height="21" rx="3.1" transform="rotate(-9 19.5 25)"/><rect x="25.4" y="4" width="6.2" height="21" rx="3.1" transform="rotate(9 28.5 25)"/></g></svg>
    <button class="plus" id="plus" type="button" aria-label="Add" aria-haspopup="menu" aria-expanded="false">+</button>
    <textarea id="text" rows="1" maxlength="20000" placeholder="What do you need?" aria-label="What do you need?" autofocus></textarea>
    <button class="go" id="go" type="button" aria-label="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
  </div>
  <div class="chips" id="chips" hidden></div>
  <div id="panel" hidden>
    <div class="ans" id="ans" tabindex="0" aria-live="polite"></div>
    <div class="meta" id="meta" hidden></div>
    <div id="card" hidden></div>
    <div class="foot"><input id="follow" type="text" maxlength="20000" placeholder="Ask a follow-up…" aria-label="Ask a follow-up" disabled><button class="ob" id="open" type="button">Open in Bunny</button></div>
  </div>
  <div class="msg" id="msg" role="status" hidden></div>
  <div class="hint" id="hint"><span>Enter to send</span><span>Shift+Enter new line</span><span>Esc to close</span></div>
  <div class="menu" id="menu" role="menu" hidden>
    <button type="button" role="menuitem" id="shot-item">Add a screenshot<small>Takes a picture of this screen when you choose it</small></button>
    <button type="button" role="menuitem" id="file-item">Add a file…<small>A picture, a PDF or a text file, up to 8 MB</small></button>
  </div>
</div>
<script type="module" src="bar.js"></script>
</body>
</html>
